- name: disable redis module
  ansible.builtin.command:
    cmd: dnf module disable redis -y

- name: enable redis:7 
  ansible.builtin.command:
    cmd: dnf module enable redis:7 -y

- name: install redis:7
  ansible.builtin.dnf:
    name: redis
    state: present

- name: allow connections
  ansible.builtin.replace:
    path: /etc/redis/redis.conf
    regexp: 127.0.0.1
    replace: 0.0.0.0
      
- name: disable proctected mode
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: 'protected-mode'
    line: 'protected-mode no'

- name: start redis
  ansible.builtin.service:
    name: redis
    state: started
    enabled: yes
