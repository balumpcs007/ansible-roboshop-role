- name: install maven
  ansible.builtin.package: 
    name: "{{ item }}"
    state: present
  loop:
  - maven
  - mysql 
- name: install mvn package
  ansible.builtin.command: mvn clean package
  args:
      chdir: /app

- name: Get Maven version
  ansible.builtin.shell: mvn help:evaluate -Dexpression=project.version -q -DforceStdout
  args:
    chdir: /app
  register: mvn_version

- name: Set version
  ansible.builtin.set_fact:
    version: "{{ mvn_version.stdout }}"

